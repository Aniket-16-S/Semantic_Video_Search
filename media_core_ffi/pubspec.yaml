name: media_core_ffi
description: >
  Flutter Native Asset plugin — wraps a statically-compiled FFmpeg
  audio demux + VAD engine (media_core.c) into a platform-native
  shared library callable from Dart via dart:ffi.

  Phase 2: Ships an ObjectBox embedded vector database (HNSW index)
  for local KNN semantic search over SigLIP SO400M 1152-dim embeddings.

  Supports Android (ARM64 via NDK) and Windows (x64 via MSVC/MinGW).

version: 0.2.0
publish_to: none   # local plugin — not published to pub.dev

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

# ── Native Assets declaration ─────────────────────────────────────────────
# This package uses Flutter Native Assets (build.dart) — NOT the older
# ffiPlugin / CMakeLists.txt system.  Do NOT add a flutter.plugin section here;
# that would tell Flutter to look for cmake build files which don't exist.
#
# Flutter automatically discovers build.dart and invokes it during
# `flutter build` and `flutter run` for any platform declared in build.dart.
#
# Requires Flutter >= 3.22 (Native Assets no longer experimental).

# ── Dart dependencies ──────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0          # toNativeUtf8(), calloc.free() used in lib/media_core_ffi.dart

  # ── Phase 2: ObjectBox embedded vector database (HNSW) ────────────────────
  objectbox: ^5.0.0            # core Dart API + query builder
  objectbox_flutter_libs: any  # platform native libs (Android .so / Windows .dll)

  # ── Phase 3: ONNX Runtime (Hardware accelerated inference) ────────────────
  onnxruntime_v2: ^1.23.2+2

  # ── Phase 4: Media ingestion & UI ──────────────────────────────────────────
  photo_manager: ^3.0.0
  path_provider: ^2.1.2
  path: ^1.9.0
  provider: ^6.1.2
  video_thumbnail: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter             # provides expect, equals, group, test, setUp, tearDown
  flutter_lints: ^3.0.0      # flutter analyze defaults
  ffigen: ^11.0.0            # generates lib/src/media_core_bindings.dart from media_core.h
  native_assets_cli: ^0.1.0   # Required by the legacy build.dart script

  # ── Phase 2: ObjectBox code generation ───────────────────────────────────
  build_runner: ^2.4.0       # dart run build_runner build
  objectbox_generator: any   # emits objectbox.g.dart from @Entity annotations

# ── ffigen configuration (run: dart run ffigen --config pubspec.yaml) ──────
ffigen:
  name: MediaCoreBindings
  description: "Auto-generated FFI bindings for media_core.h"
  output: "lib/src/media_core_bindings.dart"
  headers:
    entry-points:
      - "src/media_core.h"
  compiler-opts:
    # -Isrc is always needed; do NOT hardcode machine-specific LLVM/clang paths here.
    # If ffigen cannot find stdint.h, set the CPATH environment variable:
    #   Windows (MSYS2): export CPATH=/mingw64/lib/clang/$(clang --version | grep -oP '\d+' | head -1)/include
    #   macOS (Xcode)  : xcode-select --install
    - "-Isrc"
  functions:
    include:
      - "extract_audio_pcm"
      - "free_audio_buffer"
      - "vad_rms"
      - "vad_is_speech"
  structs:
    include:
      - "AudioBufferResult"

flutter:
  uses-material-design: true
  assets:
    - assets/models/vision_encoder_int8.onnx
    - assets/models/text_encoder_int8.onnx
    - assets/models/ppocr_det_int8.onnx
    - assets/models/ppocr_rec_int8.onnx
    # Bundle the entire Whisper directory:
    - assets/models/whisper_tiny_int8/
